<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Dashboard - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="toast-container" id="toastContainer"></div>

    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Page<span>Turner</span></a>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-outline-danger" id="adminLogout">Logout</button>
        </div>
      </div>
    </nav>

    <section class="py-4">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-3">
            <div class="profile-card p-3">
              <h5>Admin Menu</h5>
              <ul class="list-unstyled">
                <li><a href="#categories" class="d-block py-2">Categories</a></li>
                <li><a href="#customers" class="d-block py-2">Customers</a></li>
                <li><a href="#inventory" class="d-block py-2">Inventory</a></li>
              </ul>
            </div>
          </div>
          <div class="col-lg-9">
            <div class="profile-card p-4 mb-4">
              <h4>Dashboard</h4>
              <div class="row g-3 mt-3">
                <div class="col-sm-4"><div class="category-card text-center"><h3 id="statBooks">0</h3><p>Books</p></div></div>
                <div class="col-sm-4"><div class="category-card text-center"><h3 id="statCategories">0</h3><p>Categories</p></div></div>
                <div class="col-sm-4"><div class="category-card text-center"><h3 id="statCustomers">0</h3><p>Customers</p></div></div>
              </div>
            </div>

            <div id="categories" class="profile-card p-4 mb-4">
              <h5>Manage Categories</h5>
              <div class="d-flex gap-2 mb-3">
                <input id="newCategory" class="form-control" placeholder="New category" />
                <button class="btn btn-primary" id="addCategoryBtn">Add</button>
              </div>
              <ul id="categoryList" class="list-group"></ul>
            </div>

            <div id="customers" class="profile-card p-4 mb-4">
              <h5>Manage Customers</h5>
              <table class="table"><thead><tr><th>Name</th><th>Email</th><th>Actions</th></tr></thead><tbody id="customerTable"></tbody></table>
            </div>

            <div id="inventory" class="profile-card p-4 mb-4">
              <h5>Inventory</h5>
              <table class="table"><thead><tr><th>Book</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="inventoryTable"></tbody></table>
            </div>

          </div>
        </div>
      </div>
    </section>

    <script src="js/admin.js"></script>
    <script>
      document.getElementById('adminLogout').addEventListener('click', () => {
        window.Admin.logout();
      });

      document.getElementById('addCategoryBtn').addEventListener('click', () => {
        const name = document.getElementById('newCategory').value.trim();
        if (name) window.Admin.addCategory(name);
      });
    </script>
  </body>
</html>
