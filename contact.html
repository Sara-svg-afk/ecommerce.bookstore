<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Page<span>Turner</span></a>
      </div>
    </nav>

    <section class="page-header">
      <div class="container">
        <h1 class="page-title">Contact Us</h1>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="contact-card p-4">
              <h4>Get in Touch</h4>
              <p>We’d love to hear from you. Share your thoughts or ask about our catalog.</p>
              <ul class="list-unstyled">
                <li><i class="fas fa-envelope"></i> hello@pageturner.com</li>
                <li><i class="fas fa-phone"></i> +1 555 123 4567</li>
                <li><i class="fas fa-map-marker-alt"></i> 57 Reading Avenue, New York</li>
              </ul>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="contact-card p-4">
              <form>
                <div class="row g-3">
                  <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" required /></div>
                  <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" required /></div>
                  <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" rows="5" required></textarea></div>
                  <div class="col-12"><button class="btn btn-primary" type="submit">Send Message</button></div>
                </div>
              </form>
            </div>
          </div>
        </div>
        <div class="mt-4"><div class="contact-card p-4"><h4>Location</h4><img src="https://via.placeholder.com/1200x300?text=Google+Maps+Placeholder" class="img-fluid rounded-4" alt="Map placeholder" /></div></div>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
