<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Page<span>Turner</span></a>
      </div>
    </nav>

    <section class="page-header">
      <div class="container">
        <h1 class="page-title">Your Cart</h1>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-8">
            <div class="cart-table table-responsive">
              <table class="table align-middle">
                <tbody>
                  <tr>
                    <td><img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80" alt="Book" /></td>
                    <td><strong>The Midnight Orchard</strong><br /><small>Fantasy</small></td>
                    <td>
                      <div class="qty-control">
                        <button data-action="decrease">−</button>
                        <input type="number" value="1" class="form-control" style="width:70px;" />
                        <button data-action="increase">+</button>
                      </div>
                    </td>
                    <td>Rs 1899</td>
                    <td><button class="btn btn-outline-danger remove-item"><i class="fas fa-trash"></i></button></td>
                  </tr>
                  <tr>
                    <td><img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=800&q=80" alt="Book" /></td>
                    <td><strong>Mindset Shift</strong><br /><small>Self-Help</small></td>
                    <td>
                      <div class="qty-control">
                        <button data-action="decrease">−</button>
                        <input type="number" value="2" class="form-control" style="width:70px;" />
                        <button data-action="increase">+</button>
                      </div>
                    </td>
                    <td>Rs 3240</td>
                    <td><button class="btn btn-outline-danger remove-item"><i class="fas fa-trash"></i></button></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="cart-summary p-4">
              <h4>Order Summary</h4>
              <div class="d-flex justify-content-between mt-3"><span>Subtotal</span><span>Rs 5139</span></div>
              <div class="d-flex justify-content-between"><span>Shipping</span><span>Rs 499</span></div>
              <div class="d-flex justify-content-between"><span>Tax</span><span>Rs 385</span></div>
              <hr />
              <div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span>Rs 6023</span></div>
              <div class="mt-3">
                <label class="form-label">Coupon Code</label>
                <input type="text" class="form-control" placeholder="Enter code" />
              </div>
              <a href="checkout.html" class="btn btn-primary w-100 mt-3">Proceed to Checkout</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
  </body>
</html>
