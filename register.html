<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="container py-5">
      <div class="auth-card">
        <h2 class="section-title text-center">Create Account</h2>
        <p class="section-subtitle text-center">Join PageTurner and unlock exclusive recommendations.</p>
        <form>
          <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" required /></div>
          <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" required /></div>
          <div class="mb-3"><label class="form-label">Password</label><input class="form-control" id="password" type="password" required /></div>
          <div class="password-strength mb-3"><div></div></div>
          <div class="form-check mb-3"><input class="form-check-input" type="checkbox" required /><label class="form-check-label">I agree to the terms and conditions.</label></div>
          <button class="btn btn-primary w-100" type="submit">Sign Up</button>
        </form>
      </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
