<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>

    <div class="container py-5">
      <div class="auth-card">
        <h2 class="section-title text-center">Admin Sign In</h2>
        <p class="section-subtitle text-center">Secure admin access to manage the store (frontend mock).</p>
        <form id="adminLoginForm">
          <div class="mb-3"><label class="form-label">Email</label><input id="adminEmail" class="form-control" type="email" required /></div>
          <div class="mb-3"><label class="form-label">Password</label><input id="adminPassword" class="form-control" type="password" required /></div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div><input id="adminRemember" type="checkbox" /> Remember me</div>
            <a href="#">Forgot password?</a>
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign In</button>
        </form>
        <p class="text-center mt-3"><a href="index.html">Back to store</a></p>
      </div>
    </div>

    <script src="js/admin.js"></script>
    <script src="js/main.js"></script>
    <script>
      document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();
        const remember = document.getElementById('adminRemember').checked;
        if (window.Admin) {
          window.Admin.login(email, password, remember);
        }
      });
    </script>
  </body>
</html>
