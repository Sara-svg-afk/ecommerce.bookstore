<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <div class="container py-5">
      <div class="auth-card">
        <h2 class="section-title text-center">Welcome Back</h2>
        <p class="section-subtitle text-center">Sign in to continue your reading journey.</p>
        <form>
          <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" required /></div>
          <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" required /></div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div><input type="checkbox" /> Remember me</div>
            <a href="#">Forgot password?</a>
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
          <div class="text-center my-3">or continue with</div>
          <div class="d-flex gap-2">
            <button class="social-btn flex-grow-1" type="button"><i class="fab fa-google"></i> Google</button>
            <button class="social-btn flex-grow-1" type="button"><i class="fab fa-facebook-f"></i> Facebook</button>
          </div>
          <p class="text-center mt-3">New here? <a href="register.html">Create an account</a></p>
        </form>
      </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
