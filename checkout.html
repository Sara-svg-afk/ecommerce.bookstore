<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Page<span>Turner</span></a>
      </div>
    </nav>

    <section class="page-header">
      <div class="container">
        <h1 class="page-title">Checkout</h1>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-7">
            <div class="checkout-card p-4">
              <h4>Shipping Information</h4>
              <form class="row g-3 mt-2">
                <div class="col-md-6"><label class="form-label">First Name</label><input class="form-control" required /></div>
                <div class="col-md-6"><label class="form-label">Last Name</label><input class="form-control" required /></div>
                <div class="col-12"><label class="form-label">Address</label><input class="form-control" required /></div>
                <div class="col-md-6"><label class="form-label">City</label><input class="form-control" required /></div>
                <div class="col-md-6"><label class="form-label">Postal Code</label><input class="form-control" required /></div>
                <div class="col-12"><label class="form-label">Payment Method</label>
                  <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-primary" type="button">Credit Card</button>
                    <button class="btn btn-outline-primary" type="button">PayPal</button>
                    <button class="btn btn-outline-primary" type="button">Cash on Delivery</button>
                  </div>
                </div>
                <div class="col-12"><button class="btn btn-primary" type="submit">Place Order</button></div>
              </form>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="checkout-card p-4">
              <h4>Order Summary</h4>
              <div class="d-flex justify-content-between mt-3"><span>The Midnight Orchard</span><span>Rs 1899</span></div>
              <div class="d-flex justify-content-between"><span>Mindset Shift</span><span>Rs 3240</span></div>
              <hr />
              <div class="d-flex justify-content-between fw-bold"><span>Total</span><span>Rs 6023</span></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
