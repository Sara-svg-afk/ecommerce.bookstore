<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist - PageTurner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>
    <div class="toast-container" id="toastContainer"></div>
    <nav class="navbar navbar-expand-lg sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Page<span>Turner</span></a>
      </div>
    </nav>

    <section class="page-header">
      <div class="container">
        <h1 class="page-title">Your Wishlist</h1>
      </div>
    </section>

    <section>
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-6">
            <div class="wishlist-item d-flex align-items-center gap-3 p-3 border rounded-4">
              <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80" alt="Book" />
              <div class="flex-grow-1">
                <h5>The Midnight Orchard</h5>
                <p class="mb-2">Fantasy</p>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary move-to-cart">Move to Cart</button>
                  <button class="btn btn-outline-danger remove-item">Remove</button>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="wishlist-item d-flex align-items-center gap-3 p-3 border rounded-4">
              <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=800&q=80" alt="Book" />
              <div class="flex-grow-1">
                <h5>Mindset Shift</h5>
                <p class="mb-2">Self-Help</p>
                <div class="d-flex gap-2">
                  <button class="btn btn-primary move-to-cart">Move to Cart</button>
                  <button class="btn btn-outline-danger remove-item">Remove</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/wishlist.js"></script>
  </body>
</html>
